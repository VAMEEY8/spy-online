<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<title>Шпион Онлайн</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0e0e0e;color:#f2f2f2;font-family:system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;padding:16px;display:flex;flex-direction:column;gap:10px}
#view{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px}
#dock{position:sticky;bottom:0;background:#0e0e0e;padding-top:6px;display:flex;flex-direction:column;gap:6px}
h1{text-align:center;margin:0;font-size:34px;letter-spacing:3px}
.card{background:#1c1c1c;border:1px solid #333;border-radius:14px;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.row2{display:flex;gap:6px}
.num{display:flex;align-items:center;gap:14px}
.num button{width:42px;height:42px;padding:0;font-size:22px}
button{background:#2a2a2a;color:#f2f2f2;border:1px solid #444;border-radius:12px;padding:13px;font-size:17px;font-family:inherit}
button:disabled{opacity:.4}
button.main{background:#f2f2f2;color:#0e0e0e;border:0;font-weight:700}
input{flex:1;width:100%;background:#1c1c1c;border:1px solid #444;color:#f2f2f2;border-radius:12px;padding:12px;font-size:16px;font-family:inherit}
.muted{color:#8a8a8a;font-size:15px}
.big{font-size:38px;font-weight:700;word-break:break-word}
.mid{font-size:24px;font-weight:600;word-break:break-word}
.time{font-size:80px;font-weight:700;font-variant-numeric:tabular-nums}
.tap{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px}
.pl{display:flex;align-items:center;gap:10px;padding:6px 0}.pl span:nth-child(2){flex:1}
.ava{width:44px;height:44px;border-radius:50%;background:#2a2a2a;display:inline-flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex:none}
.ava img{width:100%;height:100%;object-fit:cover}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:10px}.emo button{padding:6px;font-size:22px}
#log{max-height:100px;overflow:auto;font-size:14px;color:#ccc}
#tools{overflow-x:auto}#tools button{flex:none;padding:8px 12px}
.fl{position:fixed;bottom:130px;font-size:36px;animation:up 2s forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-260px);opacity:0}}
html.light{filter:invert(1) hue-rotate(180deg)}html.light .ava,html.light .fl{filter:invert(1) hue-rotate(180deg)}
.pl button{padding:2px 10px;font-size:14px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.modes button{padding:10px 4px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.cell{padding:8px 1px;font-size:12px;min-height:54px;word-break:break-word}.cell:disabled{opacity:1}
.c-red{border-color:#c0392b}.c-blue{border-color:#2980b9}.c-n{border-color:#999}.c-x{border-color:#fff;border-style:dashed}
.rv.c-red{background:#7a2b2b}.rv.c-blue{background:#244a7a}.rv.c-n{background:#555}.rv.c-x{background:#000}
.cv{width:100%;border-radius:12px;background:#fff;touch-action:none}html.light .cv{filter:invert(1) hue-rotate(180deg)}
.ph{height:52px;border-radius:8px;vertical-align:middle;margin-right:8px}.cell .ph{display:block;width:100%;height:44px;object-fit:cover;margin:0 0 3px}.ph2{max-width:100%;max-height:34vh;border-radius:12px}
</style>
</head>
<body>
<div id="app"><div id="view"></div><div id="dock"></div></div>
<input id="f" type="file" multiple hidden><input id="ph" type="file" accept="image/*" hidden><input id="pf" type="file" accept="image/*" hidden>
<script>
const $ = s => $d.querySelector(s), $d = document;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EMO = ['🕵️','😎','🦊','🐱','🐼','🦁','🐸','🐵','🤖','👽','🦄','🐯','🐧','🦉','🐲','🥷'];
const DEF = ['Мектеп','Аурухана','Ұшақ','Базар','Кітапхана','Теңіз','Цирк','Банк'].map(place => ({game: '', place, roles: []}));
// Дауыс үшін: мобильді желіде байланыс болмаса, осы жерге TURN сервер қосылады
const ICE = {iceServers: [{urls: 'stun:stun.l.google.com:19302'}, {urls: 'stun:stun1.l.google.com:19302'}]};
const ls = (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
const sv = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
let nick = ls('nick', ''), ava = ls('ava', '🕵️'), sess = null;
try { sess = JSON.parse(sessionStorage.getItem('sess') || 'null'); } catch (e) {}
let ws, st = null, card = null, myid = null, off = 0, chat = [], guessOpen = false, lastPhase = '', myVote = null;
let stream = null, pcs = {}, muted = false;
const q = [];  // байланыс үзілсе, маңызды хабарлар кезекке тұрады
const tx = o => {
  if (ws && ws.readyState === 1) return ws.send(JSON.stringify(o));
  if (!sess || ['ping', 'sig', 'react', 'voice'].includes(o.t)) return;
  if (o.t === 'items') { const i = q.findIndex(x => x.t === 'items'); if (i >= 0) q.splice(i, 1); }
  q.push(o);
};
const av = a => String(a).startsWith('data:') ? `<img src="${a}">` : esc(a);
const isHost = () => st.host === myid;
const pl = id => st.players.find(p => p.id === id) || {nick: '?', ava: '❔'};

// <parse>
const keyOf = (o, re) => Object.keys(o).filter(k => re.test(k)).sort((a, b) => /_kk$/.test(b) - /_kk$/.test(a))[0];
const strs = a => Array.isArray(a) ? a.filter(x => typeof x === 'string' && x.trim()).map(x => x.trim()) : [];
function parse(v, out) {
  if (typeof v === 'string') { if (v.trim()) out.push({game: '', place: v.trim(), roles: []}); return; }
  if (Array.isArray(v)) { v.forEach(x => parse(x, out)); return; }
  if (!v || typeof v !== 'object') return;
  const kt = keyOf(v, /^(game|name|title|theme|topic)(_|$)/);
  const kl = keyOf(v, /^(locations?|places?|words?)(_|$)/);
  const kr = keyOf(v, /^roles?(_|$)/);
  const game = kt && typeof v[kt] === 'string' ? v[kt].trim() : '';
  if (kl) {
    const places = typeof v[kl] === 'string' ? [v[kl].trim()] : strs(v[kl]);
    const roles = kr ? strs(v[kr]) : [];
    places.forEach(place => out.push({game, place, roles}));
  } else if (game) {
    out.push({game: '', place: game, roles: []});
  } else {
    const vals = Object.values(v), nested = vals.filter(x => x && typeof x === 'object');
    (nested.length ? nested : vals).forEach(x => parse(x, out));
  }
}
function parseFile(text) {
  text = text.replace(/^\uFEFF/, '');
  const out = [];
  try {
    const j = JSON.parse(text);
    const d = j && j.data !== undefined ? j.data : j;
    parse(d, out);
    if (!out.length && d && typeof d === 'object' && !Array.isArray(d))
      Object.keys(d).forEach(k => out.push({game: '', place: k, roles: []}));
  } catch (_) {
    text.split(/\r?\n/).forEach(l => { l = l.trim(); if (l) out.push({game: '', place: l, roles: []}); });
  }
  return out;
}
// </parse>

// ---------- байланыс ----------
function go(msg) {
  const w = ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  w.onopen = () => w.send(JSON.stringify(msg));
  w.onmessage = e => on(JSON.parse(e.data));
  w.onclose = () => { if (w !== ws) return; if (sess) { clearTimeout(retry); retry = setTimeout(rejoin, 700); } else if (!st) { al('Қосыла алмады, қайталап көріңіз'); render(); } };
}
let retry;
const rejoin = () => { if (sess && (!ws || ws.readyState > 1)) go(jm({room: sess.code, id: sess.id})); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) rejoin(); });
setInterval(() => tx({t: 'ping'}), 20000);

function on(m) {
  if (m.t === 'joined') {
    myid = m.id; sess = {id: m.id, code: m.code}; sessionStorage.setItem('sess', JSON.stringify(sess));
    if (m.created) tx({t: 'items', items: DEF});
    q.splice(0).forEach(tx);
  } else if (m.t === 'state') {
    st = m; off = m.now - Date.now();
    if (st.phase !== lastPhase) {
      if (st.phase === 'play' || st.phase === 'g') { navigator.vibrate && navigator.vibrate(200); guessOpen = false; keepAwake(); }
      if (st.phase === 'vote') { myVote = null; tone(880, 500); navigator.vibrate && navigator.vibrate([200, 100, 200]); }
      if (st.phase === 'lobby') card = null;
      lastPhase = st.phase;
    }
    render(); dock(); syncVoice();
  } else if (m.t === 'role') { card = m; render(); }
  else if (m.t === 'chat') { chat.push(m); chat = chat.slice(-40); drawChat(); }
  else if (m.t === 'react') float(m.e);
  else if (m.t === 'sig') onSig(m);
  else if (m.t === 'msg') al(m.m);
  else if (m.t === 'imgs') { IM = m.map; }
  else if (m.t === 'stroke') { for (const a of m.s) { const k = [...a, m.c]; SK.push(k); strokeLine(k); } }
  else if (m.t === 'clear') { SK = []; redraw(); }
  else if (m.t === 'strokes') { SK = m.list; redraw(); }
  else if (m.t === 'err') { sess = null; sessionStorage.removeItem('sess'); const w = ws; ws = null; w && w.close(); al(m.m); st = null; render(); dock(); }
}
async function keepAwake() { try { await navigator.wakeLock.request('screen'); } catch (e) {} }

// ---------- экрандар ----------
function render() {
  const v = $('#view');
  if (!st) home(v); else ({lobby, play, vote: voteV, guess: guessV, result: resultV, g: gameV}[st.phase] || lobby)(v);
  tr(v);
}
const pRow = p => `<div class="pl"><span class="ava">${av(p.ava)}</span><span>${esc(p.nick)}${st.host === p.id ? ' ★' : ''}</span><span class="muted">${p.ready && st.phase === 'lobby' ? '✓ ' : ''}${p.voice ? '🎤 ' : ''}${p.on ? '' : 'офлайн '}</span>${isHost() && st.phase === 'lobby' && p.id !== myid ? `<button onclick="tx({t:'kick',id:'${p.id}'})">✕</button>` : ''}<b>${p.score}</b></div>`;

function home(v) {
  const code = new URLSearchParams(location.search).get('room') || '';
  v.innerHTML = `<h1>ШПИОН</h1>
  <div class="card">
    <div class="row2" style="align-items:center"><span class="ava" id="me">${av(ava)}</span><input id="nick" placeholder="Ник" maxlength="14" value="${esc(nick)}"><button onclick="$('#ph').click()">Фото</button></div>
    <div class="emo">${EMO.map(e => `<button onclick="pick('${e}')">${e}</button>`).join('')}</div>
  </div>
  <input id="pw" placeholder="Құпиясөз (міндетті емес)" maxlength="20">
  <button class="main" onclick="create()">Рум құру</button>
  <div class="row2"><input id="code" placeholder="КОД" maxlength="4" value="${esc(code.toUpperCase().slice(0, 4))}" style="text-transform:uppercase"><button onclick="joinRoom()">Кіру</button></div>
  <button onclick="localSetup()">Бір телефонда ойнау</button>
  <div class="row2"><button onclick="setLang()">${lang === 'en' ? 'Қазақша' : 'English'}</button><button onclick="setTheme()">◐</button></div>
  <div class="muted" id="stat" style="text-align:center"></div>`;
}
function pick(e) { ava = e; sv('ava', e); $('#me').innerHTML = av(e); }
$('#ph').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const c = $d.createElement('canvas'); c.width = c.height = 64;
    const s = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 64, 64);
    pick(c.toDataURL('image/jpeg', 0.7)); URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f); e.target.value = '';
};
function nk() { nick = ($('#nick').value || '').trim().slice(0, 14) || 'Ойыншы'; sv('nick', nick); }
function create() { if (busy()) return; nk(); stat(); go(jm({})); }
function joinRoom() {
  const c = ($('#code').value || '').trim().toUpperCase();
  if (c.length !== 4) return al('4 әріптік код жазыңыз');
  if (busy()) return; nk(); stat(); go(jm({room: c}));
}
function leave() {
  tx({t: 'leave'}); sess = null; sessionStorage.removeItem('sess');
  closeVoice(); st = null; card = null; chat = []; { const w = ws; ws = null; w && w.close(); } render(); dock();
}
function share() {
  const u = location.origin + '/?room=' + st.code;
  if (navigator.share) navigator.share({title: 'Шпион', text: 'Румға кір: ' + st.code, url: u}).catch(() => {});
  else navigator.clipboard.writeText(u).then(() => al('Сілтеме көшірілді'));
}
function set(k, d) {
  const v = {minutes: st.minutes, spies: st.spies, hint: st.hint, lost: st.lost, game: st.game};
  if (k === 'mode') { v.game = d === 'lost' ? 'spy' : d; v.lost = d === 'lost'; } else if (k === 'hint') v.hint = !v.hint; else v[k] = Math.max(1, Math.min(k === 'spies' ? 3 : 60, v[k] + d));
  tx({t: 'set', ...v});
}
$('#f').onchange = async e => {
  const files = [...e.target.files], all = [];
  e.target.value = '';
  for (const f of files) all.push(...parseFile(await f.text()));
  if (!all.length) return al('Файлда ештеңе табылмады');
  const seen = new Set(), items = all.filter(x => { const k = x.game + '|' + x.place; return seen.has(k) ? false : seen.add(k); });
  if (localMode) { LI = items; sv('li', JSON.stringify(items)); localSetup(); }
  else tx({t: 'items', custom: true, name: files.map(f => f.name).join(', '), items});
};

function lobby(v) {
  const h = isHost(), n = st.players.filter(p => p.on).length, rd = st.players.every(p => !p.on || p.ready || p.id === st.host), my = pl(myid), mk = st.game === 'spy' ? (st.lost ? 'lost' : 'spy') : st.game, sp = st.game === 'spy', need = MODES[mk][2];
  v.innerHTML = `<h1>${st.code}</h1>
  <button onclick="share()">Сілтемені жіберу</button>
  <div class="card"><div class="muted">Режим</div><div class="modes">${Object.keys(MODES).map(k => `<button class="${mk === k ? 'main' : ''}" ${h ? '' : 'disabled'} onclick="set('mode','${k}')">${MODES[k][lang === 'en' ? 3 : 0]}</button>`).join('')}</div><div class="muted">${MODES[mk][lang === 'en' ? 4 : 1]} · ${need}+</div></div>
  <div class="card"><div class="row" style="font-size:16px"><span>Фото қосу</span><span class="muted">${st.photos || 0}</span></div>
    <div class="row2" style="margin-top:8px"><input id="pn" placeholder="Аты (жауап)" maxlength="30" value="${esc(photoName)}" oninput="photoName=this.value"><button onclick="$('#pf').click()">Фото таңдау</button></div>
    ${h && st.photos ? `<button style="width:100%;margin-top:8px" onclick="tx({t:'photos_clear'})">Фотоларды тазалау</button>` : ''}
    <div class="muted" style="margin-top:6px">Фото «Шпион», «Кім мен?» және Codenames ойындарында қолданылады</div></div>
  <div class="card">${st.players.map(pRow).join('')}</div>
  ${h ? `<div class="card">
    ${sp ? `<div class="row">Таймер (мин)<span class="num"><button onclick="set('minutes',-1)">−</button><b>${st.minutes}</b><button onclick="set('minutes',1)">+</button></span></div>
    <div class="row" style="margin-top:10px">Шпион саны<span class="num"><button onclick="set('spies',-1)">−</button><b>${st.spies}</b><button onclick="set('spies',1)">+</button></span></div>
    <div class="row" style="margin-top:10px">Шпион тақырыпты көреді<button onclick="set('hint',0)">${st.hint ? 'Иә' : 'Жоқ'}</button></div>
    ` : ''}
    <div class="muted" style="margin:10px 0">${st.custom ? '✔ ' + esc(st.src || 'Фото') + ': ' + st.count + ' нұсқа' : 'Стандартты жинақ: ' + (st.count || DEF.length) + ' нұсқа'}</div>
    <button style="width:100%" onclick="$('#f').click()">JSON / TXT файл таңдау</button></div>
    <button class="main" onclick="tx({t:'start'})" ${n < need || !rd ? 'disabled' : ''}>Бастау (${n}/${need}+)</button>${rd ? '' : '<div class="muted" style="text-align:center">Барлығы «Дайынмын» басуы керек</div>'}`
  : `<button class="${my.ready ? '' : 'main'}" onclick="tx({t:'ready',on:${!my.ready}})">${my.ready ? 'Дайын емеспін' : 'Дайынмын'}</button><div class="muted" style="text-align:center">Хост бастауын күтіңіз…</div>`}
  <button onclick="leave()">Шығу</button>`;
}

function opts() {
  return card.opts.map(o => `<button style="width:100%;margin:4px 0" data-p="${esc(o)}" onclick="tx({t:'guess',place:this.dataset.p})">${esc(o)}</button>`).join('');
}
function play(v) {
  const spy = card && card.spy;
  v.innerHTML = `<div class="card tap" style="min-height:30vh"><div class="muted">Қалған уақыт</div><div class="time" id="t">--:--</div></div>
  <div class="card tap" id="cd" style="padding:22px;user-select:none;-webkit-user-select:none" oncontextmenu="return false"
    onpointerdown="hold(1)" onpointerup="hold(0)" onpointerleave="hold(0)" onpointercancel="hold(0)"></div>
  ${spy ? `<button onclick="guessOpen=!guessOpen;render()">Орынды болжау</button>` : ''}
  ${spy && guessOpen ? `<div class="card">${opts()}</div>` : ''}
  <div class="card">${st.players.map(pRow).join('')}</div>
  ${isHost() ? `<button class="main" onclick="tx({t:'vote_start'})">Дауыс беруді бастау</button>` : ''}`;
  hold(0);
}
function hold(on) {
  hold0(on); const e = $('#cd'); e && tr(e);
}
function hold0(on) {
  const e = $('#cd'); if (!e) return;
  if (!card) { e.innerHTML = '<div class="muted">Рөл жүктелуде…</div>'; return; }
  if (!on) { e.innerHTML = '<div class="muted">Рөлді көру үшін басып тұрыңыз</div>'; return; }
  const g = card.game ? `<div class="muted">Тақырып</div><div class="mid">${esc(card.game)}</div>` : '';
  e.innerHTML = card.spy ? `<div class="big">ШПИОН</div>${g}`
    : `${g}${card.img ? `<img class="ph2" src="${card.img}">` : ''}<div class="muted">${card.hasRoles ? 'Орын' : 'Сөз'}</div><div class="big">${esc(card.place)}</div>` +
      (card.role ? `<div class="muted">Рөл</div><div class="mid">${esc(card.role)}</div>` : '');
}
function vote(id) { myVote = id; tx({t: 'vote', target: id}); render(); }
function voteV(v) {
  const on = st.players.filter(p => p.on);
  v.innerHTML = `<h1>Дауыс беру</h1><div class="muted" style="text-align:center">Шпион кім деп ойлайсыз?</div>
  ${on.filter(p => p.id !== myid).map(p => `<button class="${myVote === p.id ? 'main' : ''}" style="display:flex;align-items:center;gap:12px;width:100%" onclick="vote('${p.id}')"><span class="ava">${av(p.ava)}</span>${esc(p.nick)}</button>`).join('')}
  <div class="muted" style="text-align:center">Дауыс берді: ${on.filter(p => p.voted).length}/${on.length}</div>
  ${isHost() ? `<button onclick="tx({t:'tally'})">Нәтижені шығару</button>` : ''}`;
}
function guessV(v) {
  v.innerHTML = card && card.spy && st.caught === myid
    ? `<h1>Сені ұстады!</h1><div class="muted" style="text-align:center">Орынды тапсаң — ұтасың</div><div class="card">${opts()}</div>`
    : `<h1>Шпион ұсталды</h1><div class="muted" style="text-align:center">${esc(pl(st.caught).nick)} орынды болжап жатыр…</div>${isHost() ? `<button onclick="tx({t:'skip'})">Өткізіп жіберу</button>` : ''}`;
}
function resultV(v) {
  const r = st.result, w = r.win === 'spy';
  v.innerHTML = `<h1>${w ? 'Шпион жеңді' : 'Шпион ұтылды'}</h1><div class="muted" style="text-align:center">${esc(r.why)}</div>
  <div class="card tap"><div class="muted">Шпион</div><div class="mid">${r.spies.map(i => esc(pl(i).nick)).join(', ')}</div>
    ${r.lost ? `<div class="muted" style="margin-top:8px">Адасқан</div><div class="mid">${esc(pl(r.lost).nick)} (${esc(r.lostPlace)})</div>` : ''}
    ${r.game ? `<div class="muted">Тақырып</div><div class="mid">${esc(r.game)}</div>` : ''}

  const g = st.g; if (!g) return;
  const ids = ['gi', 'cw', 'cn', 't0', 't1', 't2'], saved = ids.map(i => ($('#' + i) || {}).value), fid = $d.activeElement && $d.activeElement.id;
  const body = {mafia: mafiaV, who: whoV, code: codeV, draw: drawV, truth: truthV}[st.game](g);
  v.innerHTML = `<h1 style="font-size:26px">${esc(MODES[st.game][lang === 'en' ? 3 : 0])}</h1>
  ${g.endAt ? '<div class="card tap" style="min-height:0"><div class="time" id="t" style="font-size:52px">--:--</div></div>' : ''}${body}
  ${isHost() ? `<button class="${g.over ? 'main' : ''}" onclick="tx({t:'next'})">${g.over ? 'Лоббиге оралу' : 'Ойынды тоқтату'}</button>` : ''}
  <div class="card">${[...st.players].sort((a, b) => b.score - a.score).map(pRow).join('')}</div>`;
  ids.forEach((i, k) => { const e = $('#' + i); if (e && saved[k]) e.value = saved[k]; });
  const f = fid && $('#' + fid); if (f && ids.includes(fid)) f.focus();
  if (st.game === 'draw') bindCanvas(g);
}

function mafiaV(g) {
  const alive = g.alive.includes(myid), h = [];
  h.push(sm(`${g.day}-${g.ph === 'night' ? 'түн' : 'күн'}`), `<div class="card row"><span class="muted">Рөлің</span><b>${RNK[g.role]}${alive ? '' : ' · өлдің'}</b></div>`);
  if (g.mates) h.push(sm('Мафия: ' + g.mates.map(nk2).join(', ')));
  if (g.checks && g.checks.length) h.push(`<div class="card">${g.checks.map(c => `<div>${nk2(c.target)} — ${c.mafia ? 'МАФИЯ' : 'мафия емес'}</div>`).join('')}</div>`);
  if (g.over) h.push(mid(g.over.win === 'mafia' ? 'Мафия жеңді' : 'Тұрғындар жеңді'), `<div class="card">${Object.keys(g.roles).map(id => `<div class="row">${nk2(id)}<b>${RNK[g.roles[id]]}</b></div>`).join('')}</div>`);
  else if (g.ph === 'night') {
    if (!alive) h.push(sm('Сен өлдің. Үнсіз бақыла'));
    else if (g.role === 'civ') h.push(mid('Түн. Көзіңді жұм, таң атқанша күт'));
    else if (g.acted) h.push(mid('Таңдау жасалды. Күт…'));
    else h.push(mid({mafia: 'Кімді өлтіресің?', doc: 'Кімді құтқарасың?', com: 'Кімді тексересің?'}[g.role]),
      pickBtns(g.alive.filter(id => g.role === 'mafia' ? !g.mates.includes(id) : g.role === 'com' ? id !== myid : true)));
  } else if (g.ph === 'day') h.push(mid('Талқылаңдар: мафия кім?'));
  else { if (alive) h.push(mid('Кім мафия?'), pickBtns(g.alive.filter(id => id !== myid), g.voted)); h.push(sm(`Дауыс берді: ${g.nVoted}`)); }
  if (isHost() && !g.over) h.push(`<button onclick="act('force')">${{night: 'Таңды бастау', day: 'Дауыс беруді бастау', vote: 'Нәтиже'}[g.ph]}</button>`);
  if (g.log.length) h.push(`<div class="card muted">${g.log.slice(-4).map(esc).join('<br>')}</div>`);
  return h.join('');
}

function whoV(g) {
  const me = g.players.find(p => p.id === myid);
  return sm('Басқалардың кейіпкерін көресің, өзіңдікін көрмейсің. «Иә/жоқ» сұрақтарын чатта не дауыста қой, тапқанда жауабын жаз') +
    g.players.map(p => `<div class="card row"><span>${nk2(p.id)}${p.found ? ' ✓' : ''}</span><b>${p.word ? im(p.word) + esc(p.word) : '???'}</b></div>`).join('') +
    (!g.over && me && !me.found ? `<div class="row2"><input id="gi" maxlength="60" placeholder="Мен кіммін?" onkeydown="if(event.key==='Enter')whoGo()"><button onclick="whoGo()">➤</button></div>` : '') +
    (isHost() && !g.over ? `<button onclick="act('force')">Аяқтау</button>` : '');
}
function whoGo() { const i = $('#gi'), t = i.value.trim(); if (t) { act('guess', {text: t}); i.value = ''; } }

function codeV(g) {
  const TC = {red: 'Қызыл', blue: 'Көк'}, myTurn = g.mine === g.turn, can = !g.over && myTurn && !g.cap && g.clue;
  const names = c => Object.keys(g.team).filter(id => g.team[id] === c).map(id => nk2(id) + (g.caps[c] === id ? '★' : '')).join(', ');
  return sm(`${g.over ? '' : 'Кезек: ' + TC[g.turn] + ' · '}Қызыл ${g.rem.red} / Көк ${g.rem.blue}`) +
    `<div class="card"><div>🟥 ${names('red')}</div><div style="margin-top:6px">🟦 ${names('blue')}</div></div>` +
    sm(`Командаң: ${TC[g.mine]}${g.cap ? ' · Жетекші ★' : ''}`) +
    (g.over ? mid(g.over.win ? TC[g.over.win] + ' команда жеңді' : 'Ойын аяқталды') : '') +
    (g.clue ? mid(`Ишара: ${esc(g.clue.w)} ${g.clue.n}`) + sm(`Қалған болжам: ${g.left}`) : '') +
    `<div class="grid">${g.cells.map((c, i) => `<button class="cell ${c.c ? 'c-' + c.c : ''} ${c.s ? 'rv' : ''}" ${can && !c.s ? '' : 'disabled'} onclick="act('pick',{i:${i}})">${im(c.w)}${esc(c.w)}</button>`).join('')}</div>` +
    (!g.over && g.cap && myTurn && !g.clue ? `<div class="row2"><input id="cw" maxlength="30" placeholder="Ишара сөзі"><input id="cn" type="number" min="0" max="9" value="1" style="max-width:72px"><button onclick="codeClue()">➤</button></div>` : '') +
    (can ? `<button onclick="act('end')">Кезекті аяқтау</button>` : '') +
    (isHost() && !g.over ? `<button onclick="act('force')">Аяқтау</button>` : '');
}
function codeClue() { const w = $('#cw').value.trim(); if (w) act('clue', {w, n: +$('#cn').value || 0}); }

// ---- Крокодил: сурет салу ----
let SK = [], penCol = '#000000', pend = [], pt = 0;
const cvx = () => { const c = $('#cv'); return c && c.getContext && c.getContext('2d'); };
function strokeLine(k) {
  const x = cvx(); if (!x) return; const s = x.canvas.width / 1000;
  x.strokeStyle = k[4] || '#000000'; x.lineWidth = k[4] === '#ffffff' ? 28 : 5; x.lineCap = 'round';
  x.beginPath(); x.moveTo(k[0] * s, k[1] * s); x.lineTo(k[2] * s, k[3] * s); x.stroke();
}
function redraw() { const x = cvx(); if (!x) return; x.fillStyle = '#ffffff'; x.fillRect(0, 0, x.canvas.width, x.canvas.height); SK.forEach(strokeLine); }
function flush() { if (pend.length) act('stroke', {s: pend.splice(0), c: penCol}); }
function setPen(c) { flush(); penCol = c; }
function bindCanvas(g) {
  redraw();
  const can = $('#cv'); if (!can || g.drawer !== myid || g.reveal || g.over) return;
  let last = null;
  const pos = e => { const b = can.getBoundingClientRect(); return [Math.round((e.clientX - b.left) / b.width * 1000), Math.round((e.clientY - b.top) / b.height * 1000)]; };
  can.onpointerdown = e => { last = pos(e); can.setPointerCapture(e.pointerId); add([...last, ...last]); };
  can.onpointermove = e => { if (!last) return; const p = pos(e); add([...last, ...p]); last = p; };
  can.onpointerup = can.onpointercancel = () => { last = null; flush(); };
}
function add(seg) { pend.push(seg); const k = [...seg, penCol]; SK.push(k); strokeLine(k); if (!pt) pt = setTimeout(() => { pt = 0; flush(); }, 60); }
function drawV(g) {
  const dr = g.drawer === myid, pal = ['#000000', '#c0392b', '#2980b9', '#27ae60', '#f1c40f', '#ffffff'];
  return sm(`${g.round}/${g.total} · сурет салады: ${nk2(g.drawer)}`) +
    (g.word ? mid(dr && !g.reveal ? 'Сурет сал: ' + esc(g.word) : 'Сөз: ' + esc(g.word)) : mid('_ '.repeat(g.len).trim())) +
    `<canvas id="cv" class="cv" width="640" height="640"></canvas>` +
    (dr && !g.reveal && !g.over ? `<div class="row2" style="overflow-x:auto">${pal.map(c => `<button style="flex:none;background:${c};width:42px;height:42px;padding:0;color:#000" onclick="setPen('${c}')">${c === '#ffffff' ? '⌫' : ''}</button>`).join('')}<button style="flex:none" onclick="flush();SK=[];redraw();act('clear')">🗑</button></div>` : (g.reveal || g.over ? '' : sm('Жауабыңды төмендегі чатқа жаз')))
    + (g.got.length ? sm('Тапты: ' + g.got.map(nk2).join(', ')) : '') + (isHost() && !g.over ? `<button onclick="act('force')">Аяқтау</button>` : '');
}

// ---- 2 шындық 1 өтірік ----
let lieIdx = 2;
function setLie(i) { lieIdx = i; [0, 1, 2].forEach(k => $('#lb' + k).className = k === i ? 'main' : ''); }
function truthGo() { const st = [0, 1, 2].map(i => $('#t' + i).value.trim()); if (st.some(x => !x)) return al('Үш сөйлемді де жазыңыз'); act('submit', {st, lie: lieIdx}); }
function truthV(g) {
  const tl = g.teller === myid; let h = sm(`${g.round}/${g.total} · ${nk2(g.teller)}`);
  if (g.over) return h + mid('Ойын аяқталды');
  if (g.ph === 'write') h += tl
    ? mid('Өзің туралы 3 сөйлем жаз: 2 шындық, 1 өтірік') + [0, 1, 2].map(i => `<div class="row2"><input id="t${i}" maxlength="120" placeholder="${i + 1}-сөйлем"><button id="lb${i}" class="${lieIdx === i ? 'main' : ''}" onclick="setLie(${i})">Өтірік</button></div>`).join('') + `<button class="main" onclick="truthGo()">Жіберу</button>`
    : sm(`${nk2(g.teller)} сөйлемдер жазып жатыр…`);
  else if (g.ph === 'vote') {
    h += mid('Қайсысы өтірік?') + g.st.map((s, i) => `<button style="width:100%" ${tl || g.voted ? 'disabled' : ''} onclick="act('vote',{i:${i}})">${esc(s)}</button>`).join('') + sm(`Дауыс берді: ${g.nVoted}`);
    if (isHost()) h += `<button onclick="act('force')">Нәтиже</button>`;
  } else {
    h += g.st.map((s, i) => `<div class="card"><div>${i === g.lie ? '❌ ' : '✓ '}${esc(s)}</div><div class="muted">${Object.keys(g.votes).filter(id => g.votes[id] === i).map(nk2).join(', ')}</div></div>`).join('');
    if (isHost()) h += `<button class="main" onclick="act('next')">Келесі</button>`;
  }
  return h;
}

// ---------- өз фотоларың ----------
let IM = {}, photoName = '';
const im = w => IM[w] ? `<img class="ph" src="${IM[w]}">` : '';
const toImg = (f, max, q) => new Promise(res => {
  const i = new Image();
  i.onload = () => { const k = Math.min(1, max / Math.max(i.width, i.height)), c = $d.createElement('canvas'); c.width = Math.round(i.width * k); c.height = Math.round(i.height * k); c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); URL.revokeObjectURL(i.src); res(c.toDataURL('image/jpeg', q)); };
  i.src = URL.createObjectURL(f);
});
$('#pf').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const img = await toImg(f, 240, 0.6), name = photoName.trim() || f.name.replace(/\.[^.]+$/, '').slice(0, 30);
  tx({t: 'photo', name, img}); photoName = '';
};

// ---------- іске қосу ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
if (sess) go(jm({room: sess.code, id: sess.id}));
render();
</script>
</body>
</html>
