<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<title>Шпион Онлайн</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0e0e0e;color:#f2f2f2;font-family:system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;padding:16px;display:flex;flex-direction:column;gap:10px}
#view{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px}
#dock{position:sticky;bottom:0;background:#0e0e0e;padding-top:6px;display:flex;flex-direction:column;gap:6px}
h1{text-align:center;margin:0;font-size:34px;letter-spacing:3px}
.card{background:#1c1c1c;border:1px solid #333;border-radius:14px;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.row2{display:flex;gap:6px}
.num{display:flex;align-items:center;gap:14px}
.num button{width:42px;height:42px;padding:0;font-size:22px}
button{background:#2a2a2a;color:#f2f2f2;border:1px solid #444;border-radius:12px;padding:13px;font-size:17px;font-family:inherit}
button:disabled{opacity:.4}
button.main{background:#f2f2f2;color:#0e0e0e;border:0;font-weight:700}
input{flex:1;width:100%;background:#1c1c1c;border:1px solid #444;color:#f2f2f2;border-radius:12px;padding:12px;font-size:16px;font-family:inherit}
.muted{color:#8a8a8a;font-size:15px}
.big{font-size:38px;font-weight:700;word-break:break-word}
.mid{font-size:24px;font-weight:600;word-break:break-word}
.time{font-size:80px;font-weight:700;font-variant-numeric:tabular-nums}
.tap{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px}
.pl{display:flex;align-items:center;gap:10px;padding:6px 0}.pl span:nth-child(2){flex:1}
.ava{width:44px;height:44px;border-radius:50%;background:#2a2a2a;display:inline-flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex:none}
.ava img{width:100%;height:100%;object-fit:cover}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:10px}.emo button{padding:6px;font-size:22px}
#log{max-height:100px;overflow:auto;font-size:14px;color:#ccc}
#tools{overflow-x:auto}#tools button{flex:none;padding:8px 12px}
.fl{position:fixed;bottom:130px;font-size:36px;animation:up 2s forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-260px);opacity:0}}
html.light{filter:invert(1) hue-rotate(180deg)}html.light .ava,html.light .fl{filter:invert(1) hue-rotate(180deg)}
.pl button{padding:2px 10px;font-size:14px}
</style>
</head>
<body>
<div id="app"><div id="view"></div><div id="dock"></div></div>
<input id="f" type="file" multiple hidden><input id="ph" type="file" accept="image/*" hidden>
<script>
const $ = s => $d.querySelector(s), $d = document;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EMO = ['🕵️','😎','🦊','🐱','🐼','🦁','🐸','🐵','🤖','👽','🦄','🐯','🐧','🦉','🐲','🥷'];
const DEF = ['Мектеп','Аурухана','Ұшақ','Базар','Кітапхана','Теңіз','Цирк','Банк'].map(place => ({game: '', place, roles: []}));
// Дауыс үшін: мобильді желіде байланыс болмаса, осы жерге TURN сервер қосылады
const ICE = {iceServers: [{urls: 'stun:stun.l.google.com:19302'}, {urls: 'stun:stun1.l.google.com:19302'}]};
const ls = (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
const sv = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
let nick = ls('nick', ''), ava = ls('ava', '🕵️'), sess = null;
try { sess = JSON.parse(sessionStorage.getItem('sess') || 'null'); } catch (e) {}
let ws, st = null, card = null, myid = null, off = 0, chat = [], guessOpen = false, lastPhase = '', myVote = null;
let stream = null, pcs = {}, muted = false;
const q = [];  // байланыс үзілсе, маңызды хабарлар кезекке тұрады
const tx = o => {
  if (ws && ws.readyState === 1) return ws.send(JSON.stringify(o));
  if (!sess || ['ping', 'sig', 'react', 'voice'].includes(o.t)) return;
  if (o.t === 'items') { const i = q.findIndex(x => x.t === 'items'); if (i >= 0) q.splice(i, 1); }
  q.push(o);
};
const av = a => String(a).startsWith('data:') ? `<img src="${a}">` : esc(a);
const isHost = () => st.host === myid;
const pl = id => st.players.find(p => p.id === id) || {nick: '?', ava: '❔'};

// <parse>
const keyOf = (o, re) => Object.keys(o).filter(k => re.test(k)).sort((a, b) => /_kk$/.test(b) - /_kk$/.test(a))[0];
const strs = a => Array.isArray(a) ? a.filter(x => typeof x === 'string' && x.trim()).map(x => x.trim()) : [];
function parse(v, out) {
  if (typeof v === 'string') { if (v.trim()) out.push({game: '', place: v.trim(), roles: []}); return; }
  if (Array.isArray(v)) { v.forEach(x => parse(x, out)); return; }
  if (!v || typeof v !== 'object') return;
  const kt = keyOf(v, /^(game|name|title|theme|topic)(_|$)/);
  const kl = keyOf(v, /^(locations?|places?|words?)(_|$)/);
  const kr = keyOf(v, /^roles?(_|$)/);
  const game = kt && typeof v[kt] === 'string' ? v[kt].trim() : '';
  if (kl) {
    const places = typeof v[kl] === 'string' ? [v[kl].trim()] : strs(v[kl]);
    const roles = kr ? strs(v[kr]) : [];
    places.forEach(place => out.push({game, place, roles}));
  } else if (game) {
    out.push({game: '', place: game, roles: []});
  } else {
    const vals = Object.values(v), nested = vals.filter(x => x && typeof x === 'object');
    (nested.length ? nested : vals).forEach(x => parse(x, out));
  }
}
function parseFile(text) {
  text = text.replace(/^\uFEFF/, '');
  const out = [];
  try {
    const j = JSON.parse(text);
    const d = j && j.data !== undefined ? j.data : j;
    parse(d, out);
    if (!out.length && d && typeof d === 'object' && !Array.isArray(d))
      Object.keys(d).forEach(k => out.push({game: '', place: k, roles: []}));
  } catch (_) {
    text.split(/\r?\n/).forEach(l => { l = l.trim(); if (l) out.push({game: '', place: l, roles: []}); });
  }
  return out;
}
// </parse>

// ---------- байланыс ----------
function go(msg) {
  const w = ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  w.onopen = () => w.send(JSON.stringify(msg));
  w.onmessage = e => on(JSON.parse(e.data));
  w.onclose = () => { if (w !== ws) return; if (sess) { clearTimeout(retry); retry = setTimeout(rejoin, 700); } else if (!st) { al('Қосыла алмады, қайталап көріңіз'); render(); } };
}
let retry;
const rejoin = () => { if (sess && (!ws || ws.readyState > 1)) go(jm({room: sess.code, id: sess.id})); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) rejoin(); });
setInterval(() => tx({t: 'ping'}), 20000);

function on(m) {
  if (m.t === 'joined') {
    myid = m.id; sess = {id: m.id, code: m.code}; sessionStorage.setItem('sess', JSON.stringify(sess));
    if (m.created) tx({t: 'items', items: DEF});
    q.splice(0).forEach(tx);
  } else if (m.t === 'state') {
    st = m; off = m.now - Date.now();
    if (st.phase !== lastPhase) {
      if (st.phase === 'play') { navigator.vibrate && navigator.vibrate(200); guessOpen = false; keepAwake(); }
      if (st.phase === 'vote') { myVote = null; tone(880, 500); navigator.vibrate && navigator.vibrate([200, 100, 200]); }
      if (st.phase === 'lobby') card = null;
      lastPhase = st.phase;
    }
    render(); dock(); syncVoice();
  } else if (m.t === 'role') { card = m; render(); }
  else if (m.t === 'chat') { chat.push(m); chat = chat.slice(-40); drawChat(); }
  else if (m.t === 'react') float(m.e);
  else if (m.t === 'sig') onSig(m);
  else if (m.t === 'msg') al(m.m);
  else if (m.t === 'err') { sess = null; sessionStorage.removeItem('sess'); const w = ws; ws = null; w && w.close(); al(m.m); st = null; render(); dock(); }
}
async function keepAwake() { try { await navigator.wakeLock.request('screen'); } catch (e) {} }

// ---------- экрандар ----------
function render() {
  const v = $('#view');
  if (!st) home(v); else ({lobby, play, vote: voteV, guess: guessV, result: resultV}[st.phase] || lobby)(v);
  tr(v);
}
const pRow = p => `<div class="pl"><span class="ava">${av(p.ava)}</span><span>${esc(p.nick)}${st.host === p.id ? ' ★' : ''}</span><span class="muted">${p.ready && st.phase === 'lobby' ? '✓ ' : ''}${p.voice ? '🎤 ' : ''}${p.on ? '' : 'офлайн '}</span>${isHost() && st.phase === 'lobby' && p.id !== myid ? `<button onclick="tx({t:'kick',id:'${p.id}'})">✕</button>` : ''}<b>${p.score}</b></div>`;

function home(v) {
  const code = new URLSearchParams(location.search).get('room') || '';
  v.innerHTML = `<h1>ШПИОН</h1>
  <div class="card">
    <div class="row2" style="align-items:center"><span class="ava" id="me">${av(ava)}</span><input id="nick" placeholder="Ник" maxlength="14" value="${esc(nick)}"><button onclick="$('#ph').click()">Фото</button></div>
    <div class="emo">${EMO.map(e => `<button onclick="pick('${e}')">${e}</button>`).join('')}</div>
  </div>
  <input id="pw" placeholder="Құпиясөз (міндетті емес)" maxlength="20">
  <button class="main" onclick="create()">Рум құру</button>
  <div class="row2"><input id="code" placeholder="КОД" maxlength="4" value="${esc(code.toUpperCase().slice(0, 4))}" style="text-transform:uppercase"><button onclick="joinRoom()">Кіру</button></div>
  <button onclick="localSetup()">Бір телефонда ойнау</button>
  <div class="row2"><button onclick="setLang()">${lang === 'en' ? 'Қазақша' : 'English'}</button><button onclick="setTheme()">◐</button></div>
  <div class="muted" id="stat" style="text-align:center"></div>`;
}
function pick(e) { ava = e; sv('ava', e); $('#me').innerHTML = av(e); }
$('#ph').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const c = $d.createElement('canvas'); c.width = c.height = 64;
    const s = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 64, 64);
    pick(c.toDataURL('image/jpeg', 0.7)); URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f); e.target.value = '';
};
function nk() { nick = ($('#nick').value || '').trim().slice(0, 14) || 'Ойыншы'; sv('nick', nick); }
function create() { if (busy()) return; nk(); stat(); go(jm({})); }
function joinRoom() {
  const c = ($('#code').value || '').trim().toUpperCase();
  if (c.length !== 4) return al('4 әріптік код жазыңыз');
  if (busy()) return; nk(); stat(); go(jm({room: c}));
}
function leave() {
  tx({t: 'leave'}); sess = null; sessionStorage.removeItem('sess');
  closeVoice(); st = null; card = null; chat = []; { const w = ws; ws = null; w && w.close(); } render(); dock();
}
function share() {
  const u = location.origin + '/?room=' + st.code;
  if (navigator.share) navigator.share({title: 'Шпион', text: 'Румға кір: ' + st.code, url: u}).catch(() => {});
  else navigator.clipboard.writeText(u).then(() => al('Сілтеме көшірілді'));
}
function set(k, d) {
  const v = {minutes: st.minutes, spies: st.spies, hint: st.hint, lost: st.lost};
  if (k === 'hint' || k === 'lost') v[k] = !v[k]; else v[k] = Math.max(1, Math.min(k === 'spies' ? 3 : 60, v[k] + d));
  tx({t: 'set', ...v});
}
$('#f').onchange = async e => {
  const files = [...e.target.files], all = [];
  e.target.value = '';
  for (const f of files) all.push(...parseFile(await f.text()));
  if (!all.length) return al('Файлда ештеңе табылмады');
  const seen = new Set(), items = all.filter(x => { const k = x.game + '|' + x.place; return seen.has(k) ? false : seen.add(k); });
  if (localMode) { LI = items; sv('li', JSON.stringify(items)); localSetup(); }
  else tx({t: 'items', custom: true, name: files.map(f => f.name).join(', '), items});
};

function lobby(v) {
  const h = isHost(), n = st.players.filter(p => p.on).length, rd = st.players.every(p => !p.on || p.ready || p.id === st.host), my = pl(myid);
  v.innerHTML = `<h1>${st.code}</h1>
  <button onclick="share()">Сілтемені жіберу</button>
  <div class="card">${st.players.map(pRow).join('')}</div>
  ${h ? `<div class="card">
    <div class="row">Таймер (мин)<span class="num"><button onclick="set('minutes',-1)">−</button><b>${st.minutes}</b><button onclick="set('minutes',1)">+</button></span></div>
    <div class="row" style="margin-top:10px">Шпион саны<span class="num"><button onclick="set('spies',-1)">−</button><b>${st.spies}</b><button onclick="set('spies',1)">+</button></span></div>
    <div class="row" style="margin-top:10px">Шпион тақырыпты көреді<button onclick="set('hint',0)">${st.hint ? 'Иә' : 'Жоқ'}</button></div>
    <div class="row" style="margin-top:10px">Адасқан режимі<button onclick="set('lost',0)">${st.lost ? 'Иә' : 'Жоқ'}</button></div>
    <div class="muted" style="margin:10px 0">${st.custom ? '✔ ' + esc(st.src) + ': ' + st.count + ' нұсқа' : 'Стандартты жинақ: ' + (st.count || DEF.length) + ' нұсқа'}</div>
    <button style="width:100%" onclick="$('#f').click()">JSON / TXT файл таңдау</button></div>
    <button class="main" onclick="tx({t:'start'})" ${n < 3 || !rd ? 'disabled' : ''}>Бастау (${n}/3+)</button>${rd ? '' : '<div class="muted" style="text-align:center">Барлығы «Дайынмын» басуы керек</div>'}`
  : `<button class="${my.ready ? '' : 'main'}" onclick="tx({t:'ready',on:${!my.ready}})">${my.ready ? 'Дайын емеспін' : 'Дайынмын'}</button><div class="muted" style="text-align:center">Хост бастауын күтіңіз…</div>`}
  <button onclick="leave()">Шығу</button>`;
}

function opts() {
  return card.opts.map(o => `<button style="width:100%;margin:4px 0" data-p="${esc(o)}" onclick="tx({t:'guess',place:this.dataset.p})">${esc(o)}</button>`).join('');
}
function play(v) {
  const spy = card && card.spy;
  v.innerHTML = `<div class="card tap" style="min-height:30vh"><div class="muted">Қалған уақыт</div><div class="time" id="t">--:--</div></div>
  <div class="card tap" id="cd" style="padding:22px;user-select:none;-webkit-user-select:none" oncontextmenu="return false"
    onpointerdown="hold(1)" onpointerup="hold(0)" onpointerleave="hold(0)" onpointercancel="hold(0)"></div>
  ${spy ? `<button onclick="guessOpen=!guessOpen;render()">Орынды болжау</button>` : ''}
  ${spy && guessOpen ? `<div class="card">${opts()}</div>` : ''}
  <div class="card">${st.players.map(pRow).join('')}</div>
  ${isHost() ? `<button class="main" onclick="tx({t:'vote_start'})">Дауыс беруді бастау</button>` : ''}`;
  hold(0);
}
function hold(on) {
  hold0(on); const e = $('#cd'); e && tr(e);
}
function hold0(on) {
  const e = $('#cd'); if (!e) return;
  if (!card) { e.innerHTML = '<div class="muted">Рөл жүктелуде…</div>'; return; }
  if (!on) { e.innerHTML = '<div class="muted">Рөлді көру үшін басып тұрыңыз</div>'; return; }
  const g = card.game ? `<div class="muted">Тақырып</div><div class="mid">${esc(card.game)}</div>` : '';
  e.innerHTML = card.spy ? `<div class="big">ШПИОН</div>${g}`
    : `${g}<div class="muted">${card.hasRoles ? 'Орын' : 'Сөз'}</div><div class="big">${esc(card.place)}</div>` +
      (card.role ? `<div class="muted">Рөл</div><div class="mid">${esc(card.role)}</div>` : '');
}
function vote(id) { myVote = id; tx({t: 'vote', target: id}); render(); }
function voteV(v) {
  const on = st.players.filter(p => p.on);
  v.innerHTML = `<h1>Дауыс беру</h1><div class="muted" style="text-align:center">Шпион кім деп ойлайсыз?</div>
  ${on.filter(p => p.id !== myid).map(p => `<button class="${myVote === p.id ? 'main' : ''}" style="display:flex;align-items:center;gap:12px;width:100%" onclick="vote('${p.id}')"><span class="ava">${av(p.ava)}</span>${esc(p.nick)}</button>`).join('')}
  <div class="muted" style="text-align:center">Дауыс берді: ${on.filter(p => p.voted).length}/${on.length}</div>
  ${isHost() ? `<button onclick="tx({t:'tally'})">Нәтижені шығару</button>` : ''}`;
}
function guessV(v) {
  v.innerHTML = card && card.spy && st.caught === myid
    ? `<h1>Сені ұстады!</h1><div class="muted" style="text-align:center">Орынды тапсаң — ұтасың</div><div class="card">${opts()}</div>`
    : `<h1>Шпион ұсталды</h1><div class="muted" style="text-align:center">${esc(pl(st.caught).nick)} орынды болжап жатыр…</div>${isHost() ? `<button onclick="tx({t:'skip'})">Өткізіп жіберу</button>` : ''}`;
}
function resultV(v) {
  const r = st.result, w = r.win === 'spy';
  v.innerHTML = `<h1>${w ? 'Шпион жеңді' : 'Шпион ұтылды'}</h1><div class="muted" style="text-align:center">${esc(r.why)}</div>
  <div class="card tap"><div class="muted">Шпион</div><div class="mid">${r.spies.map(i => esc(pl(i).nick)).join(', ')}</div>
    ${r.lost ? `<div class="muted" style="margin-top:8px">Адасқан</div><div class="mid">${esc(pl(r.lost).nick)} (${esc(r.lostPlace)})</div>` : ''}
    ${r.game ? `<div class="muted">Тақырып</div><div class="mid">${esc(r.game)}</div>` : ''}
    <div class="muted">${card && card.hasRoles ? 'Орын' : 'Сөз'}</div><div class="big">${esc(r.place)}</div></div>
  <div class="card">${[...st.players].sort((a, b) => b.score - a.score).map(pRow).join('')}</div>
  ${isHost() ? `<button class="main" onclick="tx({t:'next'})">Келесі раунд</button>` : ''}
  <button onclick="leave()">Шығу</button>`;
}
let lastTick = 99;
setInterval(() => {
  const t = $('#t'); if (!t || !st) return;
  const s = Math.ceil(Math.max(0, st.endAt - (Date.now() + off)) / 1000);
  t.textContent = mmss(s);
  if (st.phase === 'play' && s <= 10 && s > 0 && s !== lastTick) tone(660, 120);
  lastTick = s;
}, 250);

// ---------- чат және реакция ----------
function dock() {
  const d = $('#dock');
  if (!st) { d.innerHTML = ''; return; }
  if (!$('#log')) d.innerHTML = `<div id="log"></div><div class="row2"><input id="ci" placeholder="Хабар…" maxlength="200" onkeydown="if(event.key==='Enter')sendChat()"><button onclick="sendChat()">➤</button></div><div class="row2" id="tools"></div>`;
  $('#tools').innerHTML = `<button onclick="setSnd()">${ls('snd', '1') === '1' ? '🔔' : '🔕'}</button><button onclick="setLang()">${lang === 'en' ? 'KZ' : 'EN'}</button><button onclick="setTheme()">◐</button><button onclick="toggleVoice()">${stream ? '🎤 Өшіру' : '🎤 Қосу'}</button>${stream ? `<button onclick="mute()">${muted ? '🔇' : '🔊'}</button>` : ''}${['👍','😂','😮','🤔','🔥'].map(e => `<button onclick="tx({t:'react',e:'${e}'})">${e}</button>`).join('')}`;
  drawChat(); tr($('#dock'));
}
function drawChat() {
  const l = $('#log'); if (!l) return;
  l.innerHTML = chat.map(m => `<div><b>${esc(m.nick)}:</b> ${esc(m.text)}</div>`).join(''); l.scrollTop = l.scrollHeight;
}
function sendChat() { const i = $('#ci'), t = i.value.trim(); if (t) { tx({t: 'chat', text: t}); i.value = ''; } }
function float(e) {
  const d = $d.createElement('div'); d.className = 'fl'; d.textContent = e; d.style.left = (10 + Math.random() * 80) + '%';
  $d.body.append(d); setTimeout(() => d.remove(), 2000);
}

// ---------- дауыстық чат (WebRTC) ----------
async function toggleVoice() {
  if (!stream) {
    try { stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}}); }
    catch (e) { return al('Микрофонға рұқсат берілмеді'); }
    muted = false; tx({t: 'voice', on: true});
  } else { closeVoice(); tx({t: 'voice', on: false}); }
  dock();
}
function mute() { muted = !muted; stream.getAudioTracks().forEach(t => t.enabled = !muted); dock(); }
function closeVoice() { stream && stream.getTracks().forEach(t => t.stop()); stream = null; Object.keys(pcs).forEach(dropPc); }
function dropPc(id) { const c = pcs[id]; if (c) { c.pc.close(); c.el.remove(); delete pcs[id]; } }
function syncVoice() {
  if (!stream || !st) return;
  const ids = st.players.filter(p => p.voice && p.id !== myid).map(p => p.id);
  Object.keys(pcs).filter(id => !ids.includes(id)).forEach(dropPc);
  ids.forEach(id => { if (!pcs[id]) mkPc(id, myid < id); });
}
function mkPc(id, offerer) {
  const pc = new RTCPeerConnection(ICE), el = $d.createElement('audio');
  el.autoplay = true; el.playsInline = true; $d.body.append(el);
  pcs[id] = {pc, el, q: []};
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  pc.ontrack = e => { el.srcObject = e.streams[0]; el.play().catch(() => {}); };
  pc.onicecandidate = e => e.candidate && tx({t: 'sig', to: id, data: {c: e.candidate}});
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') { dropPc(id); setTimeout(syncVoice, 1500); } };
  if (offerer) pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => tx({t: 'sig', to: id, data: {d: pc.localDescription}}));
}
async function onSig(m) {
  if (!stream) return;
  let c = pcs[m.from];
  if (!c) { if (!m.data.d || m.data.d.type !== 'offer') return; mkPc(m.from, false); c = pcs[m.from]; }
  const pc = c.pc;
  try {
    if (m.data.d) {
      await pc.setRemoteDescription(m.data.d);
      if (m.data.d.type === 'offer') { await pc.setLocalDescription(await pc.createAnswer()); tx({t: 'sig', to: m.from, data: {d: pc.localDescription}}); }
      for (const x of c.q.splice(0)) await pc.addIceCandidate(x);
    }
    if (m.data.c) { if (pc.remoteDescription) await pc.addIceCandidate(m.data.c); else c.q.push(m.data.c); }
  } catch (e) {}
}

// ---------- қосымша: тіл, тақырып, дыбыс, қосылу қорғанысы ----------
const rnd = n => Math.random() * n | 0;
const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const mmss = s => String(s / 60 | 0).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
let cid = ls('cid', ''); if (!cid) { cid = Math.random().toString(36).slice(2) + Date.now().toString(36); sv('cid', cid); }
const jm = o => ({t: 'join', nick, ava, cid, pw: ($('#pw') || {}).value || '', ...o});
const busy = () => ws && ws.readyState <= 1 && !sess;  // екі рет басып, екі ойыншы болып кетпеу үшін
const stat = () => {
  const s = $('#stat'); if (s) { s.textContent = 'Қосылуда… сервер оянуы 1 минутқа дейін алады'; tr(s); }
  $d.querySelectorAll('#view button').forEach(b => b.disabled = true);
};
let lang = ls('lang', 'kk'), ac;
const EN = {'ШПИОН':'SPY','Шпион':'Spy','Ник':'Nickname','Фото':'Photo','Рум құру':'Create room','КОД':'CODE','Кіру':'Join',
'Құпиясөз (міндетті емес)':'Password (optional)','Бір телефонда ойнау':'Play on one phone','Қазақша':'Қазақша',
'Сілтемені жіберу':'Share link','Таймер (мин)':'Timer (min)','Шпион саны':'Spies','Шпион тақырыпты көреді':'Spy sees the topic',
'Адасқан режимі':'Lost player mode','Адасқан':'Lost player','Иә':'Yes','Жоқ':'No','JSON / TXT файл таңдау':'Choose JSON / TXT file',
'Хост бастауын күтіңіз…':'Waiting for the host…','Шығу':'Leave','Дайынмын':'I am ready','Дайын емеспін':'Not ready',
'Барлығы «Дайынмын» басуы керек':'Everyone must press “I am ready”','офлайн':'offline','Қалған уақыт':'Time left',
'Рөлді көру үшін басып тұрыңыз':'Press and hold to see your role','Рөл жүктелуде…':'Loading role…','Орынды болжау':'Guess the place',
'Дауыс беруді бастау':'Start voting','Тақырып':'Topic','Орын':'Place','Сөз':'Word','Рөл':'Role','Дауыс беру':'Vote',
'Шпион кім деп ойлайсыз?':'Who is the spy?','Нәтижені шығару':'Show result','Сені ұстады!':'You were caught!',
'Орынды тапсаң — ұтасың':'Guess the place to win','Шпион ұсталды':'Spy caught','Өткізіп жіберу':'Skip','Шпион жеңді':'Spy wins',
'Шпион ұтылды':'Spy loses','Келесі раунд':'Next round','Шпион орынды тапты':'Spy found the place',
'Шпион орынды таба алмады':'Spy missed the place','Қарапайым ойыншы шығарылды':'An innocent player was voted out',
'Дауыс тең болды немесе берілмеді':'Votes tied or none cast','Шпион жауап бермеді':'Spy did not answer','Шпион ойыннан шықты':'Spy left the game',
'Хабар…':'Message…','🎤 Өшіру':'🎤 Off','🎤 Қосу':'🎤 On','4 әріптік код жазыңыз':'Enter the 4-letter code',
'Файлда ештеңе табылмады':'Nothing found in the file','Микрофонға рұқсат берілмеді':'Microphone permission denied',
'Сілтеме көшірілді':'Link copied','Рум табылмады':'Room not found','Рум толы':'Room is full','Ойын басталып кетті':'Game already started',
'Құпиясөз қате':'Wrong password','Хост сізді румнан шығарды':'The host removed you','Барлығы дайын емес':'Not everyone is ready',
'Қосыла алмады, қайталап көріңіз':'Could not connect, try again','Ойыншылар':'Players','Ойнау':'Play','Көру үшін басыңыз':'Tap to see',
'Жасыру үшін басыңыз':'Tap to hide','Бәрі көрді':'Everyone has seen','Ойынды бастау':'Start the game','Ойын жүріп жатыр':'Game in progress',
'Шпионды ашу':'Reveal the spy','Тоқтату':'Stop','Уақыт бітті':'Time is up','Қайта ойнау':'Play again','Баптаулар':'Settings','Артқа':'Back',
'Стандартты жинаққа қайту':'Back to default set'};
const RX = [[/(\d+)-ойыншы/g, 'Player $1'], [/^Бастау \(/, 'Start ('], [/ нұсқа/, ' options'], [/^Стандартты жинақ:/, 'Default set:'],
  [/\(файл\)/, '(file)'], [/^Дауыс берді:/, 'Voted:'], [/ орынды болжап жатыр…/, ' is guessing the place…'],
  [/^Қосылуда… .*/, 'Connecting… the server may take up to a minute to wake up']];
const T = s => {
  if (lang !== 'en') return s;
  const k = s.trim(); if (EN[k]) return s.replace(k, EN[k]);
  return RX.reduce((x, [r, b]) => x.replace(r, b), s);
};
const al = m => alert(T(m));
function tr(root) {
  if (lang !== 'en' || !root) return;
  const w = $d.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  while (n = w.nextNode()) { if (n.parentNode.closest('#log')) continue; const v = T(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; }
  root.querySelectorAll('[placeholder]').forEach(e => e.placeholder = T(e.placeholder));
}
function tone(f, ms) {
  if (ls('snd', '1') !== '1') return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = .15; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
    o.start(); setTimeout(() => o.stop(), ms);
  } catch (e) {}
}
function setSnd() { sv('snd', ls('snd', '1') === '1' ? '0' : '1'); dock(); }
function setLang() { lang = lang === 'en' ? 'kk' : 'en'; sv('lang', lang); $('#dock').innerHTML = ''; render(); dock(); }
function setTheme() { sv('th', $d.documentElement.classList.toggle('light') ? 'l' : 'd'); }
if (ls('th', 'd') === 'l') $d.documentElement.classList.add('light');

// ---------- бір телефондағы режим (интернетсіз) ----------
let localMode = false, LI = [], LG = null, lt = null;
let LS = {n: +ls('ln', 4) || 4, m: +ls('lm', 5) || 5, s: 1, lost: false};
try { LI = JSON.parse(ls('li', '[]')); } catch (e) {}
const V = h => { const v = $('#view'); v.innerHTML = h; tr(v); };
function lset(k, d, lo, hi) { LS[k] = Math.max(lo, Math.min(hi, LS[k] + d)); sv('ln', LS.n); sv('lm', LS.m); localSetup(); }
function localSetup() {
  clearInterval(lt); localMode = true;
  V(`<h1>ШПИОН</h1>
  <div class="card row">Ойыншылар<span class="num"><button onclick="lset('n',-1,3,20)">−</button><b>${LS.n}</b><button onclick="lset('n',1,3,20)">+</button></span></div>
  <div class="card row">Таймер (мин)<span class="num"><button onclick="lset('m',-1,1,60)">−</button><b>${LS.m}</b><button onclick="lset('m',1,1,60)">+</button></span></div>
  <div class="card row">Шпион саны<span class="num"><button onclick="lset('s',-1,1,3)">−</button><b>${LS.s}</b><button onclick="lset('s',1,1,3)">+</button></span></div>
  <div class="card row">Адасқан режимі<button onclick="LS.lost=!LS.lost;localSetup()">${LS.lost ? 'Иә' : 'Жоқ'}</button></div>
  <div class="card"><div class="muted" style="margin-bottom:10px">${LI.length ? LI.length + ' нұсқа (файл)' : 'Стандартты жинақ: ' + DEF.length + ' нұсқа'}</div>
    <button style="width:100%" onclick="$('#f').click()">JSON / TXT файл таңдау</button>
    ${LI.length ? `<button style="width:100%;margin-top:8px" onclick="LI=[];sv('li','[]');localSetup()">Стандартты жинаққа қайту</button>` : ''}</div>
  <button class="main" onclick="lstart()">Ойнау</button><button onclick="localMode=false;render()">Артқа</button>`);
}
function lstart() {
  const pool = LI.length ? LI : DEF, e = pool[rnd(pool.length)], n = LS.n;
  const k = Math.max(1, Math.min(LS.s, (n - 1) >> 1)), ids = shuf([...Array(n).keys()]);
  const lost = LS.lost && n >= 4 ? ids[k] : -1;
  const same = pool.filter(x => x.game === e.game && x.place !== e.place), alt = same.length ? same : pool.filter(x => x.place !== e.place);
  LG = {e, spies: ids.slice(0, k), lost, dp: lost >= 0 && alt.length ? alt[rnd(alt.length)] : e, roles: shuf(e.roles), i: 0, shown: false};
  lreveal();
}
function lreveal() {
  if (LG.i >= LS.n) return V(`<div class="card tap" style="min-height:40vh"><div class="big">Бәрі көрді</div><div class="muted">${LS.n} ойыншы · ${LS.m} мин</div></div><button class="main" onclick="lplay()">Ойынды бастау</button>`);
  const i = LG.i, spy = LG.spies.includes(i), x = i === LG.lost ? LG.dp : LG.e, role = spy || !LG.roles.length ? '' : LG.roles[i % LG.roles.length];
  const body = !LG.shown ? `<div class="big">${i + 1}-ойыншы</div><div class="muted">Көру үшін басыңыз</div>`
    : spy ? `<div class="big">ШПИОН</div><div class="muted">Жасыру үшін басыңыз</div>`
    : `${x.game ? `<div class="muted">Тақырып</div><div class="mid">${esc(x.game)}</div>` : ''}<div class="muted">${LG.e.roles.length ? 'Орын' : 'Сөз'}</div><div class="big">${esc(x.place)}</div>${role ? `<div class="muted">Рөл</div><div class="mid">${esc(role)}</div>` : ''}<div class="muted" style="margin-top:12px">Жасыру үшін басыңыз</div>`;
  V(`<div class="card tap ${LG.shown && spy ? '' : ''}" style="min-height:65vh;user-select:none" onclick="ltap()">${body}</div>`);
}
function ltap() { if (LG.shown) { LG.shown = false; LG.i++; } else LG.shown = true; lreveal(); }
function lplay() {
  const end = Date.now() + LS.m * 6e4; let last = 99;
  V(`<div class="card tap" style="min-height:50vh"><div class="muted">Ойын жүріп жатыр</div><div class="time" id="t">--:--</div></div><button class="main" onclick="lfinish(false)">Шпионды ашу</button><button onclick="localSetup()">Тоқтату</button>`);
  lt = setInterval(() => {
    const s = Math.ceil(Math.max(0, end - Date.now()) / 1000), t = $('#t'); if (t) t.textContent = mmss(s);
    if (s <= 10 && s > 0 && s !== last) tone(660, 120);
    last = s; if (!s) lfinish(true);
  }, 250);
}
function lfinish(up) {
  clearInterval(lt); const e = LG.e;
  if (up) { tone(880, 700); navigator.vibrate && navigator.vibrate([300, 100, 300]); }
  V(`<div class="card tap" style="min-height:50vh">${up ? '<div class="muted">Уақыт бітті</div>' : ''}
    <div class="muted">Шпион</div><div class="big">${LG.spies.map(i => i + 1).sort((a, b) => a - b).join(', ')}-ойыншы</div>
    ${LG.lost >= 0 ? `<div class="muted" style="margin-top:8px">Адасқан</div><div class="mid">${LG.lost + 1}-ойыншы (${esc(LG.dp.place)})</div>` : ''}
    ${e.game ? `<div class="muted" style="margin-top:8px">Тақырып</div><div class="mid">${esc(e.game)}</div>` : ''}
    <div class="muted">${e.roles.length ? 'Орын' : 'Сөз'}</div><div class="big">${esc(e.place)}</div></div>
  <button class="main" onclick="lstart()">Қайта ойнау</button><button onclick="localSetup()">Баптаулар</button>`);
}

// ---------- іске қосу ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
if (sess) go(jm({room: sess.code, id: sess.id}));
render();
</script>
